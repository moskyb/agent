# Docker capability smoke tests for this fork. See docker-smoke.md.
agents:
  queue: "${DOCKER_SMOKE_QUEUE:-default}"

steps:
  - label: ":docker: Plugin and checkout mount"
    key: docker-plugin
    timeout_in_minutes: 5
    command: >-
      grep -Fx 'module github.com/buildkite/agent/v4' go.mod &&
      mkdir -p tmp/docker-plugin &&
      printf 'docker-plugin-checkout-ok\n' > tmp/docker-plugin/result.txt
    plugins:
      - docker#v5.14.0:
          image: alpine:3.22
    artifact_paths:
      - tmp/docker-plugin/result.txt

  - label: ":docker: Compose, native agent build and Buildx"
    key: docker-runtime
    timeout_in_minutes: 30
    command: bash .buildkite/steps/docker-smoke.sh
    artifact_paths:
      - tmp/docker-smoke/*.txt
      - tmp/docker-smoke/*.log
      - tmp/docker-smoke/checksums.sha256

  - label: ":package: Verify artifact round trip"
    depends_on:
      - docker-plugin
      - docker-runtime
    timeout_in_minutes: 5
    command: |
      mkdir -p tmp/artifact-smoke
      buildkite-agent artifact download 'tmp/docker-plugin/result.txt' tmp/artifact-smoke --step docker-plugin
      buildkite-agent artifact download 'tmp/docker-smoke/*' tmp/artifact-smoke --step docker-runtime
      grep -Fx 'docker-plugin-checkout-ok' tmp/artifact-smoke/tmp/docker-plugin/result.txt
      (cd tmp/artifact-smoke && sha256sum -c tmp/docker-smoke/checksums.sha256)
