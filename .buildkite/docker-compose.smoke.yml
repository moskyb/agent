# Used alongside docker-compose.yml to reuse the upstream agent build image.
services:
  agent:
    environment:
      - SMOKE_RUN_ID
    volumes:
      - smoke-data:/smoke-data

  smoke-http:
    image: busybox:1.37.0
    command:
      - sh
      - -ec
      - |
        mkdir -p /www
        printf 'compose-network-ok\n' > /www/probe
        exec httpd -f -p 8080 -h /www
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/probe | grep -Fx compose-network-ok"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  smoke-data:
